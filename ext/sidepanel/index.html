<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>抖音增强 · 设置</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="brand">
      <img src="../icons/icon48.png" alt="" width="28" height="28" />
      <div>
        <h1>抖音增强</h1>
        <p>修改后立即生效，无需刷新页面</p>
      </div>
    </header>

    <section class="card master" id="master-card">
      <label class="row">
        <span class="row-text">
          <span class="row-title">恢复原版抖音</span>
          <span class="row-desc" id="master-desc">关闭全部功能，页面与原版抖音完全一致</span>
        </span>
        <input type="checkbox" class="switch" id="master" />
      </label>
    </section>

    <section class="card">
      <h2>播放区按钮</h2>
      <label class="row">
        <span class="row-text">
          <span class="row-title">详情</span>
          <span class="row-desc">播放区右上角，跳转到当前视频 / 图文的详情页</span>
        </span>
        <input type="checkbox" class="switch" data-feature="detail" />
      </label>
      <label class="row">
        <span class="row-text">
          <span class="row-title">下载</span>
          <span class="row-desc">下载无水印视频或图文原图</span>
        </span>
        <input type="checkbox" class="switch" data-feature="download" />
      </label>
      <div class="row slider-row" id="opacity-row">
        <span class="row-text">
          <span class="row-title">图标透明度</span>
          <span class="row-desc">默认 90%，与原生「点赞」一致</span>
        </span>
        <span class="slider">
          <input type="range" id="icon-opacity" min="20" max="100" step="5" aria-label="图标透明度" />
          <output id="icon-opacity-value" for="icon-opacity">90%</output>
        </span>
      </div>
    </section>

    <section class="card">
      <h2>进度条</h2>
      <label class="row">
        <span class="row-text">
          <span class="row-title">跳转接管</span>
          <span class="row-desc">点击或拖动进度条后抖音没有跳转时，由插件完成跳转</span>
        </span>
        <input type="checkbox" class="switch" data-feature="seek" />
      </label>
      <div class="status" id="status" data-state="unknown">
        <span class="dot" aria-hidden="true"></span>
        <span class="status-text" id="status-text">自动检测：尚未检测，点一下进度条即可</span>
        <button type="button" class="link" id="run-test">重新检测</button>
      </div>
      <p class="advice" id="advice" hidden></p>

      <label class="row">
        <span class="row-text">
          <span class="row-title">悬停显示章节信息</span>
          <span class="row-desc">鼠标停在进度条上时显示章节标题、该处时间和下一章</span>
        </span>
        <input type="checkbox" class="switch" data-feature="chapters" />
      </label>
    </section>

    <section class="card">
      <h2>页面</h2>
      <label class="row">
        <span class="row-text">
          <span class="row-title">侧栏收起 / 展开按钮</span>
          <span class="row-desc">顶栏搜索框左侧；关闭后侧栏恢复常显</span>
        </span>
        <input type="checkbox" class="switch" data-feature="sidebar" />
      </label>
    </section>

    <footer id="version"></footer>
    <script src="panel.js"></script>
  </body>
</html>
